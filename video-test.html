<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f0f0;
        }
        .video-container {
            width: 80%;
            max-width: 800px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        video {
            width: 100%;
            display: block;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="testVideo" controls>
            <source src="https://static.videezy.com/system/resources/previews/000/005/529/original/New_York_City_Aerial_View.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="controls">
            <button onclick="document.getElementById('testVideo').play()">Play</button>
            <button onclick="document.getElementById('testVideo').pause()">Pause</button>
            <button onclick="document.getElementById('testVideo').load()">Reload</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('testVideo');
            
            // Log video events
            video.addEventListener('loadeddata', function() {
                console.log('Video loaded successfully');
            });
            
            video.addEventListener('error', function(e) {
                console.error('Video error:', e);
            });
            
            video.addEventListener('playing', function() {
                console.log('Video is playing');
            });
            
            // Try to play automatically
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    console.log('Autoplay started');
                })
                .catch(error => {
                    console.log('Autoplay failed:', error);
                });
            }
        });
    </script>
</body>
</html>
